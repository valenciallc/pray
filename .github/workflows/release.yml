name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: بناء APK وتوقيعه ونشره
    runs-on: ubuntu-latest
    env:
      # عند دفع وسم v* يُستخدم اسم الوسم، وفي التشغيل اليدوي يُستخدم manual-<رقم التشغيل>.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('manual-{0}', github.run_number) }}

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: إعداد Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Node 20 مع تخزين npm مؤقتاً
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: تثبيت حزم Node
        run: npm ci

      - name: إعداد Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # نفس فحوص CI قبل أي بناء: --no-bump يبني dist محلياً دون تغيير رقم الإصدار،
      # ثم --check يتحقق من البصمات والاتساق، ثم npm test لتشغيل اختبارات الدخان.
      - name: بناء dist دون رفع رقم الإصدار
        run: python3 tools/release.py --no-bump

      - name: فحص اتساق الإصدار والبصمات
        run: python3 tools/release.py --check

      - name: اختبارات الدخان
        run: npm test

      # الأسرار المطلوبة للإصدار الآلي (Settings → Secrets and variables → Actions):
      # KEYSTORE_BASE64: محتوى ملف keystore بصيغة base64 على سطر واحد.
      # KEYSTORE_PASSWORD: كلمة مرور المتجر (storePassword).
      # KEYSTORE_ALIAS: اسم المفتاح داخل المتجر (keyAlias).
      # KEY_PASSWORD: كلمة مرور المفتاح نفسه (keyPassword).
      - name: فكّ ملف keystore من السر
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::السر KEYSTORE_BASE64 غير معرّف"
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/pray-release.keystore
          test -s android/app/pray-release.keystore

      # build.gradle يقرأ هذه المفاتيح من android/local.properties،
      # ويحلّ keystore.file نسبياً من android/app، لذلك كُتبت app/pray-release.keystore.
      - name: إنشاء local.properties للتوقيع
        run: |
          cat > android/local.properties <<'EOF'
          keystore.file=app/pray-release.keystore
          keystore.password=${{ secrets.KEYSTORE_PASSWORD }}
          keystore.alias=${{ secrets.KEYSTORE_ALIAS }}
          keystore.keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: ضبط متغيرات Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME غير متوفر في بيئة Runner"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: بناء APK للإصدار
        run: cd android && ./gradlew assembleRelease

      - name: رفع APK كأثر
        uses: actions/upload-artifact@v4
        with:
          name: pray-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: إنشاء GitHub Release وإرفاق APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
